[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Local AI agent-swarming platform for the ASUS GX10 with a terminal control center"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=8,<9",
    "pydantic>=2.9,<3",
    "httpx>=0.27",
    "psutil>=5.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[project.scripts]
swarm = "swarm.__main__:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hardware: requires the real GX10 (GPU, Ollama). Skipped unless SWARM_HW_TESTS=1",
    "ollama: requires a reachable Ollama server. Skipped unless SWARM_OLLAMA_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "UP042"]
